<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Offline-first currency converter with manual rate override">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
    <link rel="preload" href="fonts/nunito-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Exchange">
    <meta name="theme-color" content="#e8faf5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141a2c" media="(prefers-color-scheme: dark)">
    <title>Exchange</title>

    <style>
        /* Visual language: animal-island-ui (MIT) — https://github.com/guokaigdg/animal-island-ui
           Re-implemented in plain CSS from its design-system specs; no React runtime. */

        /* Nunito (OFL), self-hosted so the app keeps its look offline */
        @font-face {
            font-family: 'Nunito';
            src: url('fonts/nunito-latin-wght.woff2') format('woff2');
            font-weight: 200 1000; font-style: normal; font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            color-scheme: light;
            --font: Nunito, -apple-system, 'Segoe UI', sans-serif;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);

            /* wallpaper: dots-teal */
            --wall: #e8faf5;
            --wall-dot: rgba(130, 213, 187, 0.32);
            --wall-dot2: rgba(170, 235, 210, 0.22);

            --card: rgb(247, 243, 223);
            --field: #fffdf7;
            --ink: #794f27;            /* headline brown — never pure black */
            --body: #725d42;
            --muted: #9f927d;
            --placeholder: #c4b89e;
            --line: #c4b89e;
            --btn: #f8f8f0;
            --btn-shadow: #bdaea0;
            --btn-border: #dcd8d1;

            --primary: #19c8b9;
            --primary-active: #11a89b;
            --primary-bg: #e6f9f6;
            --focus: #ffcc00;
            --focus-d: #e0b800;
            --focus-ring: 0 3px 0 0 var(--focus-d), 0 0 0 3px rgba(255, 204, 0, 0.15);

            /* tag palette (soft variants) */
            --tag: #f5f0e6;      --tag-ink: #8f734f;
            --manual: #f3e5f5;   --manual-ink: #7b1fa2;
            --warn: #fff8e1;     --warn-ink: #c98a0b;
            --off: #ffebee;      --off-ink: #c62828;

            /* Title ribbon: app-teal, one step deeper so white text clears 3:1 */
            --rf: #40a880; --rb: #2b7a5c; --rk: #0f3d2e; --rt: #fff;

            --shadow-sm: 0 2px 4px 0 rgba(61, 52, 40, 0.06);
            --shadow-base: 0 3px 10px 0 rgba(61, 52, 40, 0.10);
            --panel-shadow: 0 -12px 32px rgba(61, 52, 40, 0.18);
            --mask: rgba(61, 52, 40, 0.28);
        }

        /* Starry night: the library ships no dark theme. Deep navy surfaces and cream ink; the
           yellow input focus is kept and reads like starlight, the mint accent stays. */
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --wall: #141a2c;
                --wall-dot: rgba(255, 228, 150, 0.10);
                --wall-dot2: rgba(200, 215, 255, 0.05);
                --card: #1f2740;
                --field: #171d31;
                --ink: #f6ecd6;
                --body: #dfd8c6;
                --muted: #a3a6b8;
                --placeholder: #5e6681;
                --line: #3a4466;
                --btn: #2a3352;
                --btn-shadow: #0a0e1a;
                --btn-border: #3a4466;
                --primary: #3dd4c6;
                --primary-active: #19c8b9;
                --primary-bg: #1d3d4a;
                --focus-ring: 0 3px 0 0 #e0b800, 0 0 0 3px rgba(255, 204, 0, 0.18);
                --tag: #2a3352;      --tag-ink: #dfd8c6;
                --manual: #3a3260;   --manual-ink: #d9c2ff;
                --warn: #403a22;     --warn-ink: #f7cd67;
                --off: #47283a;      --off-ink: #ffa3a3;
                --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.25);
                --shadow-base: 0 3px 10px 0 rgba(0, 0, 0, 0.35);
                --panel-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
                --mask: rgba(5, 7, 15, 0.6);
            }
        }

        body {
            font-family: var(--font);
            font-weight: 500;
            letter-spacing: 0.01em;
            background:
                radial-gradient(circle, var(--wall-dot) 1.5px, transparent 1.5px) 0 0 / 28px 28px,
                radial-gradient(circle, var(--wall-dot2) 1px, transparent 1px) 7px 7px / 14px 14px,
                var(--wall);
            background-attachment: fixed;
            color: var(--body);
            line-height: 1.5;
            padding: 36px 16px 64px;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .wrap { max-width: 440px; margin: 0 auto; }

        header {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            margin-bottom: 30px;
        }

        /* ---- Title: swallowtail ribbon ---- */
        h1.ribbon {
            position: relative;
            display: inline-flex; align-items: center; justify-content: center;
            height: 2em; padding: 0 1.6em;
            font-size: 1.5rem; font-weight: 900; line-height: 1;
            letter-spacing: 0.04em; white-space: nowrap;
            color: var(--rt);
            filter: drop-shadow(0 0.08em 0.12em rgba(0, 0, 0, 0.05));
            user-select: none;
        }
        .ribbon > i { position: absolute; display: block; font-style: normal; }
        .ribbon .back {
            bottom: -0.4em; width: 1.7em; height: 1.7em;
            background: var(--rb); z-index: 1;
        }
        .ribbon .back.l { left: -0.6em; border-radius: 0.08em 0 0 0.08em;
                          clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 30% 50%, 0% 0%); }
        .ribbon .back.r { right: -0.6em; border-radius: 0 0.08em 0.08em 0;
                          clip-path: polygon(0% 0%, 100% 0%, 70% 50%, 100% 100%, 0% 100%); }
        .ribbon .fold { top: calc(100% - 0.05em); width: 0; height: 0; border-style: solid; z-index: 2; }
        .ribbon .fold.l { left: 0.15em; border-width: 0 0.95em 0.45em 0;
                          border-color: transparent var(--rk) transparent transparent; }
        .ribbon .fold.r { right: 0.16em; border-width: 0 0 0.45em 0.95em;
                          border-color: transparent transparent transparent var(--rk); }
        .ribbon .front {
            inset: 0 0.1em; background: var(--rf); border-radius: 0.2em; z-index: 3;
            transform: perspective(11.5em) rotateX(3deg);
            box-shadow: inset 0 -0.06em 0 rgba(0, 0, 0, 0.05);
        }
        .ribbon .txt {
            position: relative; z-index: 4;
            display: inline-flex; align-items: center; gap: 0.35em;
            padding-top: 0.06em;
            text-shadow: 0 0.04em 0.08em rgba(0, 0, 0, 0.08);
        }
        .ribbon .txt .ico { width: 1.3em; height: 1.3em; margin-top: -0.12em; color: #6b4a2e; }

        /* ---- Card: no shadow, layering by tone ---- */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
        }

        .row { display: flex; gap: 10px; align-items: stretch; }

        /* ---- Input: cream pill, yellow focus ---- */
        input#amount, output#result {
            flex: 1 1 auto; min-width: 0;
            height: 64px;
            background: var(--field);
            border: none;
            border-radius: 50px;
            padding: 0 24px;
            font: inherit;
            font-size: 1.65rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
            color: var(--ink);
            text-align: right;
            transition: box-shadow 0.2s var(--ease), background 0.2s var(--ease);
        }
        input#amount::placeholder { color: var(--placeholder); font-weight: 400; }
        input#amount:hover { box-shadow: 0 3px 0 0 var(--line); }
        input#amount:focus {
            outline: none;
            box-shadow: var(--focus-ring);
        }
        output#result {
            display: flex; align-items: center; justify-content: flex-end;
            background: transparent;
            color: var(--primary-active);
            cursor: pointer;
            -webkit-user-select: all; user-select: all;
        }
        @media (prefers-color-scheme: dark) { output#result { color: var(--primary); } }
        output#result.empty { color: var(--placeholder); font-weight: 600; }

        .caption {
            font-size: 0.82rem; font-weight: 600; color: var(--muted);
            text-align: right; padding: 6px 128px 0 0; min-height: 1.8em;
        }

        /* ---- Buttons ---- */
        button { font: inherit; letter-spacing: 0.02em; -webkit-tap-highlight-color: transparent; }
        button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* default: soft elevation, teal on hover */
        button.picker {
            flex: 0 0 108px; min-width: 0; height: 64px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--btn);
            border: 2px solid var(--btn-border);
            border-radius: 50px;
            padding: 0 12px 0 16px;
            font-size: 1.1rem; font-weight: 800;
            color: var(--ink);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        button.picker .ico { width: 18px; height: 18px; color: var(--muted); transition: color 0.2s var(--ease); }
        @media (hover: hover) {
            button.picker:hover { color: var(--primary); border-color: var(--primary);
                                  box-shadow: var(--shadow-base); transform: translateY(-1px); }
            button.picker:hover .ico { color: var(--primary); }
        }
        button.picker:active { color: var(--primary-active); border-color: var(--primary-active);
                               transform: translateY(0); box-shadow: var(--shadow-sm); }

        /* primary: the 3D game button — the only place the stacked shadow lives */
        .btn-primary {
            background: var(--btn); color: var(--ink);
            border: 2px solid var(--btn);
            font-weight: 700; line-height: 1;
            box-shadow: 0 5px 0 0 var(--btn-shadow);
            cursor: pointer;
            transition: all 0.15s var(--ease);
        }
        @media (hover: hover) {
            .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 0 0 var(--btn-shadow); }
        }
        .btn-primary:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 0 var(--btn-shadow); }
        .btn-primary:disabled { opacity: 0.5; cursor: default; }

        button.round {
            width: 52px; height: 52px; flex: 0 0 52px;
            border-radius: 50%;
            display: grid; place-items: center;
            padding: 0;
        }
        #swap { display: flex; align-items: center; justify-content: center; gap: 0; }
        #swap .ico { width: 20px; height: 20px; margin: 0 -3px; }

        button.ghost-round {
            width: 40px; height: 40px; flex: 0 0 40px;
            border-radius: 50%;
            display: grid; place-items: center;
            background: var(--btn); color: var(--ink);
            border: 2px solid var(--btn-border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        button.ghost-round .ico { width: 22px; height: 22px; }
        @media (hover: hover) {
            button.ghost-round:hover:not(:disabled) { border-color: var(--primary);
                box-shadow: var(--shadow-base); transform: translateY(-1px); }
        }
        button.ghost-round:disabled .ico { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        button.pill-btn {
            height: 45px; padding: 0 22px; border-radius: 50px; font-size: 0.95rem;
        }
        button.pill-btn.quiet {
            background: transparent; color: var(--muted);
            border: 2px solid var(--btn-border); box-shadow: var(--shadow-sm);
            font-weight: 700; cursor: pointer; transition: all 0.2s var(--ease);
        }
        @media (hover: hover) {
            button.pill-btn.quiet:hover { color: var(--primary); border-color: var(--primary); }
        }

        /* ---- Divider: dashed-brown, 12px rhythm ---- */
        .swapwrap { display: flex; align-items: center; gap: 14px; margin: 6px 0 10px; }
        .swapwrap .rule {
            flex: 1; height: 2px;
            background: linear-gradient(to right, var(--line) 50%, transparent 50%) center / 12px 2px repeat-x;
        }

        .meta {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-top: 14px; flex-wrap: wrap;
        }
        .rateline { font-size: 0.95rem; font-variant-numeric: tabular-nums; color: var(--body); }
        .rateline strong { color: var(--ink); font-weight: 800; }
        .rateline .dim { color: var(--muted); }
        .badges { display: flex; align-items: center; gap: 8px; margin-left: auto; }

        /* ---- Tag: soft pills ---- */
        .badge, .pill {
            display: inline-flex; align-items: center; gap: 4px;
            height: 28px; padding: 0 12px;
            border-radius: 999px; border: 1.5px solid transparent;
            font-size: 0.78rem; font-weight: 700; line-height: 1;
            white-space: nowrap;
            background: var(--tag); color: var(--tag-ink);
            transition: all 0.2s var(--ease);
        }
        .badge.manual { background: var(--manual); color: var(--manual-ink); }
        .badge.stale, .badge.none { background: var(--warn); color: var(--warn-ink); }
        .pill { background: var(--off); color: var(--off-ink); }
        .pill .ico { width: 18px; height: 18px; }

        /* ---- Collapse ---- */
        details {
            margin-top: 18px;
            border: 2px solid var(--line);
            border-radius: 18px;
        }
        summary {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px;
            cursor: pointer; list-style: none;
            font-size: 0.95rem; font-weight: 700; color: var(--body);
            border-radius: 16px;
        }
        summary::-webkit-details-marker { display: none; }
        summary:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        summary .knob {
            width: 26px; height: 26px; flex: none; border-radius: 50%;
            display: grid; place-items: center;
            background: var(--primary); color: #fff;
            box-shadow: 0 2px 4px rgba(25, 200, 185, 0.3);
            transition: transform 0.3s var(--ease);
        }
        summary .knob .ico { width: 18px; height: 18px; stroke-width: 5; }
        details[open] summary .knob { transform: rotate(180deg); }
        .collapse-body { padding: 2px 16px 16px; }

        .manualbox { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .manualbox input {
            flex: 1 1 140px; min-width: 0; height: 45px;
            background: var(--field); border: none; border-radius: 50px;
            padding: 0 18px; font: inherit; font-weight: 600;
            font-variant-numeric: tabular-nums; color: var(--ink);
            transition: box-shadow 0.2s var(--ease);
        }
        .manualbox input::placeholder { color: var(--placeholder); font-weight: 400; }
        .manualbox input:hover { box-shadow: 0 3px 0 0 var(--line); }
        .manualbox input:focus { outline: none;
            box-shadow: var(--focus-ring); }
        .hint { font-size: 0.82rem; color: var(--muted); margin-top: 12px; }

        /* ---- Currency sheet: Drawer (bottom on phones) ---- */
        dialog#sheet {
            border: none; padding: 0; color: var(--body);
            background: var(--card);
            width: min(440px, 100%);
            max-width: 100%;
            box-shadow: var(--panel-shadow);
            font-family: var(--font);
        }
        dialog#sheet::backdrop { background: var(--mask); }
        dialog#sheet[open] { animation: slide-up 0.3s var(--ease) both; }
        dialog#sheet[open]::backdrop { animation: fade-in 0.25s var(--ease); }
        @keyframes slide-up { from { transform: translateY(100%); } }
        @keyframes fade-in { from { opacity: 0; } }
        @media (max-width: 560px) {
            dialog#sheet {
                margin: 0; top: auto; bottom: 0;
                max-height: 88dvh; height: 88dvh;
                border-radius: 20px 20px 0 0;
            }
        }
        @media (min-width: 561px) {
            dialog#sheet { margin: auto; border-radius: 24px; max-height: 78vh; }
            dialog#sheet[open] { animation: pop-in 0.25s var(--ease) both; }
            @keyframes pop-in { from { transform: translateY(12px) scale(0.97); opacity: 0; } }
        }
        dialog#sheet[open] { display: flex; flex-direction: column; }
        @media (prefers-reduced-motion: reduce) {
            dialog#sheet[open], dialog#sheet[open]::backdrop { animation: none; }
        }

        .sheet-head {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 16px 12px;
            flex: none;
        }
        .search {
            flex: 1 1 auto; min-width: 0;
            display: flex; align-items: center; gap: 8px;
            height: 45px; padding: 0 16px;
            background: var(--field); border-radius: 50px;
            transition: box-shadow 0.2s var(--ease);
        }
        .search:focus-within { box-shadow: var(--focus-ring); }
        .search .ico { width: 20px; height: 20px; color: var(--muted); }
        .search input {
            flex: 1 1 auto; min-width: 0;
            background: transparent; border: none; outline: none;
            font: inherit; font-size: 1rem; font-weight: 600; color: var(--ink);
        }
        .search input::placeholder { color: var(--placeholder); font-weight: 400; }
        .closebtn {
            width: 40px; height: 40px; flex: none; border-radius: 50%;
            display: grid; place-items: center;
            background: none; border: none; color: var(--ink); cursor: pointer;
            transition: background 0.2s var(--ease);
        }
        .closebtn .ico { width: 30px; height: 30px; }
        @media (hover: hover) { .closebtn:hover { background: rgba(114, 93, 66, 0.1); } }

        .sheet-rule {
            flex: none; height: 2px; margin: 0 16px;
            background: linear-gradient(to right, var(--line) 50%, transparent 50%) center / 12px 2px repeat-x;
        }

        #sheet-list {
            list-style: none; margin: 0; padding: 6px 10px 16px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            flex: 1 1 auto;
        }
        #sheet-list:focus { outline: none; }
        #sheet-list .group {
            padding: 12px 10px 6px; font-size: 0.74rem; font-weight: 800;
            letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
        }
        #sheet-list li[role="option"] {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; margin: 2px 0;
            border-radius: 16px; cursor: pointer;
            transition: background 0.15s var(--ease);
        }
        #sheet-list li .code {
            font-weight: 800; color: var(--ink);
            min-width: 3.6em; height: 28px; padding: 0 10px; flex: none;
            display: inline-grid; place-items: center;
            background: var(--tag); border-radius: 999px; font-size: 0.85rem;
        }
        #sheet-list li .nm { flex: 1 1 auto; min-width: 0; overflow: hidden;
                             text-overflow: ellipsis; white-space: nowrap; }
        #sheet-list li .sym { color: var(--muted); font-size: 0.85rem; font-weight: 700; }
        #sheet-list li[aria-selected="true"] .code { background: var(--primary); color: #0f3d2e; }
        #sheet-list li.active { background: var(--field); }
        @media (hover: hover) { #sheet-list li[role="option"]:hover { background: var(--field); } }
        #sheet-list mark { background: none; color: var(--primary-active); font-weight: 800; }
        @media (prefers-color-scheme: dark) { #sheet-list mark { color: var(--primary); } }
        #sheet-list li[aria-selected="true"] mark { color: inherit; }
        #sheet-empty { padding: 20px 26px; }

        /* ---- Update notice ---- */
        .banner {
            position: fixed; left: 16px; right: 16px; bottom: 20px;
            max-width: 408px; margin: 0 auto;
            background: var(--field);
            border: 2px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow-base);
            padding: 10px 10px 10px 20px;
            display: flex; align-items: center; gap: 12px;
            font-size: 0.92rem; font-weight: 700; color: var(--ink);
        }
        .banner button { margin-left: auto; }

        /* Icons: naive-icons (MIT), inlined as a sprite so the page stays self-contained.
           Their #2A2A2A outline is mapped to currentColor so it follows the brown ink. */
        .ico {
            width: 1em; height: 1em; flex: none;
            fill: none; stroke: currentColor;
            stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
        }

        .hidden { display: none !important; }
        footer { text-align: center; color: var(--muted); font-size: 0.8rem; font-weight: 600; margin-top: 22px; }
        footer a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
    </style>
</head>

        <symbol id="n-refresh" viewBox="0 0 48 48"><path d="M37 16 A 14.5 14.5 0 1 0 38.5 24" stroke="#2A9D8F" stroke-width="3.5" fill="none"/><path d="M30 10 L 39 11 L 35 19 Z" fill="#E76F51"/></symbol>
        <symbol id="n-chevron-down" viewBox="0 0 48 48"><path d="M12 19 L 24 31 L 36 19" fill="none" stroke="currentColor" stroke-width="3.5"/></symbol>
        <symbol id="n-search" viewBox="0 0 48 48"><circle cx="20" cy="20" r="12" fill="#2A9D8F"/><circle cx="20" cy="20" r="6" fill="#FFFFFF"/><path d="M30 30 L42 42" stroke="currentColor" stroke-width="4.5"/></symbol>
        <symbol id="n-cloud" viewBox="0 0 48 48"><path d="M14 30 C 8 30 6 22 12 20 C 12 14 20 12 24 16 C 28 10 38 14 36 22 C 42 22 42 30 36 30 Z" fill="#FAEDCD"/><circle cx="20" cy="24" r="1.5" fill="currentColor"/><circle cx="28" cy="24" r="1.5" fill="currentColor"/></symbol>
        <symbol id="n-close" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="#FAEDCD"/><path d="M17 17 L 31 31" stroke="#E76F51" stroke-width="4.5"/><path d="M31 17 L 17 31" stroke="#E76F51" stroke-width="4.5"/></symbol>
    </svg>

    <div class="wrap">
        <header>
            <h1 class="ribbon">
                <i class="back l"></i><i class="back r"></i><i class="fold l"></i><i class="fold r"></i><i class="front"></i>
                <span class="txt"><svg class="ico" aria-hidden="true"><use href="#n-bellbag"/></svg>Exchange</span>
            </h1>
            <span id="net" class="pill hidden"><svg class="ico" aria-hidden="true"><use href="#n-cloud"/></svg>offline</span>
        </header>

        <main class="card">
            <div class="field">
                <div class="row">
                    <input id="amount" type="text" inputmode="decimal" autocomplete="off"
                           spellcheck="false" aria-label="Amount" placeholder="0">
                    <button type="button" class="picker" id="from" aria-haspopup="listbox" aria-label="Convert from"><span class="code"></span><svg class="ico" aria-hidden="true"><use href="#n-chevron-down"/></svg></button>

                <span class="rule"></span>
                <button id="swap" class="btn-primary round" type="button" title="Swap currencies" aria-label="Swap currencies"><svg class="ico" aria-hidden="true"><use href="#n-arrow-down"/></svg><svg class="ico" aria-hidden="true"><use href="#n-arrow-up"/></svg></button>
                <span class="rule"></span>

                    <button type="button" class="picker" id="to" aria-haspopup="listbox" aria-label="Convert to"><span class="code"></span><svg class="ico" aria-hidden="true"><use href="#n-chevron-down"/></svg></button>

                <div class="caption" id="to-name"></div>

            <div class="meta">
                <div id="rateline" class="rateline"></div>
                <div class="badges">

                    <button id="refresh" class="ghost-round" type="button" title="Refresh rates" aria-label="Refresh rates"><svg class="ico" aria-hidden="true"><use href="#n-refresh"/></svg></button>
                </div>

            <details id="manual">
                <summary><span class="knob"><svg class="ico" aria-hidden="true"><use href="#n-chevron-down"/></svg></span>Set rate manually</summary>
                <div class="collapse-body">
                    <div class="manualbox">
                        <input id="manual-rate" type="text" inputmode="decimal" autocomplete="off"
                               spellcheck="false" aria-label="Manual rate">
                        <button id="manual-save" class="btn-primary pill-btn" type="button">Save</button>
                        <button id="manual-clear" class="pill-btn quiet hidden" type="button">Clear</button>

                    <p id="manual-hint" class="hint"></p>
                </div>
            </details>
        </main>

        <footer>
            Rates from <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter</a>
            &middot; works offline<br>
            Style by <a href="https://github.com/guokaigdg/animal-island-ui" target="_blank" rel="noopener">Animal Island UI</a>
        </footer>
    </div>


    <dialog id="sheet" aria-label="Choose a currency">
        <div class="sheet-head">
            <label class="search">
                <svg class="ico" aria-hidden="true"><use href="#n-search"/></svg>
                <input id="sheet-q" type="text" role="combobox" aria-expanded="true" aria-controls="sheet-list"
                       aria-autocomplete="list" autocomplete="off" spellcheck="false" enterkeyhint="go"
                       placeholder="Search name, code or symbol">
            </label>
            <button type="button" id="sheet-close" class="closebtn" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="#n-close"/></svg></button>
        </div>
        <div class="sheet-rule"></div>
        <ul id="sheet-list" role="listbox" tabindex="-1"></ul>
        <p id="sheet-empty" class="hint hidden">No currency matches that.</p>
    </dialog>

    <div id="update" class="banner hidden">
        <span>New version available.</span>
        <button id="reload" class="btn-primary pill-btn" type="button">Reload</button>
    </div>

    <script>
        const API = 'https://api.frankfurter.dev/v2';
        const BASE = 'EUR';                  // one base covers every pair by cross-rate
        const STALE_DAYS = 7;
        const K = { rates: 'xch:rates', currencies: 'xch:currencies', ui: 'xch:ui', overrides: 'xch:overrides' };

        // ===== Storage: API bodies are stored verbatim, exactly as received =====
        const read = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
        const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

        // enough to render the pickers on a cold first launch with no network
        const FALLBACK_CURRENCIES = [
            { iso_code: 'EUR', name: 'Euro', symbol: '€' },
            { iso_code: 'USD', name: 'US Dollar', symbol: '$' },
            { iso_code: 'DKK', name: 'Danish Krone', symbol: 'kr.' },
            { iso_code: 'GBP', name: 'British Pound', symbol: '£' },
            { iso_code: 'CHF', name: 'Swiss Franc', symbol: 'CHF' },
            { iso_code: 'SEK', name: 'Swedish Krona', symbol: 'kr' },
            { iso_code: 'NOK', name: 'Norwegian Krone', symbol: 'kr' },
            { iso_code: 'JPY', name: 'Japanese Yen', symbol: '¥' },
            { iso_code: 'THB', name: 'Thai Baht', symbol: '฿' },
            { iso_code: 'MUR', name: 'Mauritian Rupee', symbol: '₨' },
            { iso_code: 'PLN', name: 'Polish Zloty', symbol: 'zł' },
            { iso_code: 'CAD', name: 'Canadian Dollar', symbol: '$' },
            { iso_code: 'AUD', name: 'Australian Dollar', symbol: '$' },
            { iso_code: 'TRY', name: 'Turkish Lira', symbol: '₺' },
        ];

        // ===== State =====
        let rates = read(K.rates, null);             // /v2/rates array, verbatim
        let currencies = read(K.currencies, null);   // /v2/currencies array, verbatim
        let ui = Object.assign({ from: 'EUR', to: 'DKK', amount: '100', recent: [] }, read(K.ui, {}));
        let overrides = read(K.overrides, {});
        let fresh = false;                           // reached the network this session — not persisted

        // index on read; whole rows are kept so each currency's own `date` survives
        let byQuote = {};
        const reindex = () => { byQuote = Object.fromEntries((rates || []).map((r) => [r.quote, r])); };
        reindex();

        const nameMap = () => {
            const list = (currencies && currencies.length) ? currencies : FALLBACK_CURRENCIES;
            return Object.fromEntries(list.map((c) => [c.iso_code, c]));
        };
        let names = nameMap();

        // ===== Helpers =====
        const pairKey = (a, b) => a + '/' + b;
        const daysAgo = (iso) => (Date.now() - new Date(iso + 'T00:00').getTime()) / 86400000;
        const fmtDate = (iso) => new Date(iso + 'T00:00').toLocaleDateString([], { day: 'numeric', month: 'short' });
        const rtf = new Intl.RelativeTimeFormat([], { numeric: 'auto' });
        const ago = (ms) => {
            const d = Math.round((ms - Date.now()) / 86400000);
            return d === 0 ? 'today' : rtf.format(d, 'day');
        };

        // accepts "1 234,56" and "1234.56"; returns null for anything not finite
        function parseAmount(str) {
            const cleaned = String(str).replace(/[\s  ']/g, '').replace(',', '.');
            if (!/^-?\d*\.?\d+$/.test(cleaned)) return null;
            const n = Number(cleaned);
            return Number.isFinite(n) ? n : null;
        }

        const fmtAmount = (n) => new Intl.NumberFormat([], {
            minimumFractionDigits: 2,
            maximumFractionDigits: (n !== 0 && Math.abs(n) < 1) ? 4 : 2,
        }).format(n);

        const fmtRate = (r) => new Intl.NumberFormat([], {
            minimumFractionDigits: 2,
            maximumFractionDigits: r >= 1000 ? 2 : r >= 1 ? 4 : 6,
        }).format(r);

        // ===== Rate resolution: override > live > cached > none =====
        function resolveRate(from, to) {
            const direct = overrides[pairKey(from, to)];
            if (direct) return { rate: direct.rate, source: 'manual', setAt: direct.setAt };
            const inverse = overrides[pairKey(to, from)];
            if (inverse && inverse.rate) return { rate: 1 / inverse.rate, source: 'manual', setAt: inverse.setAt, inverted: true };

            const a = byQuote[from], b = byQuote[to];
            if (a && b && a.rate) {
                const asOf = [a.date, b.date].sort()[0];      // the older leg governs
                return { rate: b.rate / a.rate, source: fresh ? 'live' : 'cached', asOf };
            }
            return { rate: null, source: 'none' };
        }

        // ===== Elements =====
        const el = {
            amount: document.getElementById('amount'),
            from: document.getElementById('from'),
            to: document.getElementById('to'),
            result: document.getElementById('result'),
            rateline: document.getElementById('rateline'),
            badge: document.getElementById('badge'),
            swap: document.getElementById('swap'),
            refresh: document.getElementById('refresh'),
            net: document.getElementById('net'),
            manual: document.getElementById('manual'),
            manualRate: document.getElementById('manual-rate'),
            manualSave: document.getElementById('manual-save'),
            manualClear: document.getElementById('manual-clear'),
            manualHint: document.getElementById('manual-hint'),
            fromName: document.getElementById('from-name'),
            toName: document.getElementById('to-name'),
            sheet: document.getElementById('sheet'),
            sheetQ: document.getElementById('sheet-q'),
            sheetList: document.getElementById('sheet-list'),
            sheetEmpty: document.getElementById('sheet-empty'),
            sheetClose: document.getElementById('sheet-close'),
            update: document.getElementById('update'),
            reload: document.getElementById('reload'),
        };

        // ===== Pickers =====
        // A native <select> was the obvious choice and the wrong one: it can only display the
        // 3-letter code (a full "EUR — Euro" label would be truncated), it offers no search on
        // iOS, and scrolling 165 options to find MUR is hopeless. So: a button that opens a
        // searchable sheet.
        const currencyRows = () => {
            const codes = Object.keys(byQuote).length ? Object.keys(byQuote) : Object.keys(names);
            return codes.map((c) => ({
                code: c,
                name: (names[c] && names[c].name) || c,
                symbol: (names[c] && names[c].symbol) || '',
            }));
        };

        const paintPickers = () => {
            el.from.querySelector('.code').textContent = ui.from;
            el.to.querySelector('.code').textContent = ui.to;
        };

        function noteRecent(code) {
            ui.recent = [code].concat(ui.recent.filter((c) => c !== code)).slice(0, 6);
        }

        // ===== Currency sheet =====
        let sheetSide = 'from';     // which picker opened it
        let flat = [];              // rows in display order, for keyboard nav
        let active = 0;

        // NFD strips accents (Króna -> Krona), but letters with a stroke or bar don't
        // decompose — the live currency list has Złoty, Đồng and Paʻanga — so map those too.
        const FOLD = { 'ł': 'l', 'đ': 'd', 'ð': 'd', 'ø': 'o', 'ħ': 'h', 'ŀ': 'l', 'ı': 'i',
                       'æ': 'ae', 'œ': 'oe', 'ß': 'ss', 'þ': 'th', 'ʻ': "'", '\u2019': "'" };
        const norm = (str) => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
            .replace(/[łđðøħŀıæœßþʻ\u2019]/g, (c) => FOLD[c] || c);
        const esc = (str) => str.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // highlight the matched run so it's obvious why a row is in the list
        function hl(text, q) {
            if (!q) return esc(text);
            const i = norm(text).indexOf(q);
            if (i < 0) return esc(text);
            return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
        }

        // rank: exact code, code prefix, name prefix, any word prefix, then substrings
        function grouped(q) {
            const all = currencyRows();
            if (!q) {
                const recent = ui.recent.map((c) => all.find((r) => r.code === c)).filter(Boolean);
                const taken = new Set(recent.map((r) => r.code));
                const rest = all.filter((r) => !taken.has(r.code)).sort((a, b) => a.code.localeCompare(b.code));
                return [
                    recent.length ? { label: 'Recent', items: recent } : null,
                    { label: all.length + ' currencies', items: rest },
                ].filter(Boolean);
            }
            const scored = [];
            for (const r of all) {
                const c = norm(r.code), n = norm(r.name), sy = norm(r.symbol);
                let rank = -1;
                if (c === q) rank = 0;
                else if (c.startsWith(q)) rank = 1;
                else if (n.startsWith(q)) rank = 2;
                else if (n.split(/[\s-]+/).some((w) => w.startsWith(q))) rank = 3;
                else if (c.includes(q)) rank = 4;
                else if (n.includes(q)) rank = 5;
                else if (sy && sy.includes(q)) rank = 6;
                if (rank >= 0) scored.push([rank, r]);
            }
            scored.sort((a, b) => a[0] - b[0] || a[1].code.localeCompare(b[1].code));
            const items = scored.map((x) => x[1]);
            return items.length ? [{ label: items.length + (items.length === 1 ? ' match' : ' matches'), items }] : [];
        }

        function paintSheet() {
            const q = norm(el.sheetQ.value.trim());
            const groups = grouped(q);
            flat = groups.flatMap((g) => g.items);
            active = flat.findIndex((r) => r.code === ui[sheetSide]);
            if (active < 0) active = 0;

            el.sheetList.innerHTML = groups.map((g) =>
                '<li class="group" role="presentation">' + esc(g.label) + '</li>' +
                g.items.map((r) => {
                    const i = flat.indexOf(r);
                    return '<li role="option" data-code="' + r.code + '" id="opt-' + r.code + '"' +
                        ' aria-selected="' + (r.code === ui[sheetSide]) + '"' +
                        (i === active ? ' class="active"' : '') + '>' +
                        '<span class="code">' + hl(r.code, q) + '</span>' +
                        '<span class="nm">' + hl(r.name, q) + '</span>' +
                        (r.symbol ? '<span class="sym">' + esc(r.symbol) + '</span>' : '') +
                        '</li>';
                }).join('')
            ).join('');

            el.sheetEmpty.classList.toggle('hidden', flat.length > 0);
            el.sheetQ.setAttribute('aria-activedescendant', flat.length ? 'opt-' + flat[active].code : '');
        }

        function markActive(next) {
            if (!flat.length) return;
            active = (next + flat.length) % flat.length;
            const items = [...el.sheetList.querySelectorAll('li[role="option"]')];
            items.forEach((li) => li.classList.remove('active'));
            const li = items.find((x) => x.dataset.code === flat[active].code);
            if (li) { li.classList.add('active'); li.scrollIntoView({ block: 'nearest' }); }
            el.sheetQ.setAttribute('aria-activedescendant', 'opt-' + flat[active].code);
        }

        function openSheet(side) {
            sheetSide = side;
            el.sheetQ.value = '';
            paintSheet();
            el.sheet.showModal();
            const current = el.sheetList.querySelector('li[aria-selected="true"]');
            if (current) current.scrollIntoView({ block: 'center' });
            // showModal() autofocuses the first focusable child — the search field — which on a
            // phone throws the keyboard up over the list you're trying to browse. Move focus to
            // the list instead; tapping the field still opens the keyboard when you want it.
            const touch = (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer: coarse)').matches;
            if (touch) el.sheetList.focus(); else el.sheetQ.focus();
        }

        function choose(code) {
            if (!code) return;
            ui[sheetSide] = code;
            noteRecent(code);
            el.sheet.close();
            paintPickers();
            render();
        }

        // ===== Render =====
        function render() {
            const { from, to } = ui;
            const r = resolveRate(from, to);
            const amount = parseAmount(el.amount.value);

            if (r.rate == null || amount == null) {
                el.result.textContent = '—';
                el.result.classList.add('empty');
            } else {
                el.result.textContent = fmtAmount(amount * r.rate);
                el.result.classList.remove('empty');
            }

            el.fromName.textContent = names[from] ? names[from].name : '';
            el.toName.textContent = names[to] ? names[to].name : '';

            const sym = (names[to] && names[to].symbol) ? names[to].symbol : to;
            if (r.rate == null) {
                el.rateline.innerHTML = '<span class="dim">No rate for ' + from + ' → ' + to + ' yet.</span>';
                el.badge.textContent = 'no rate — set one';
                el.badge.className = 'badge none';
            } else {
                el.rateline.innerHTML = '1 ' + from + ' = <strong>' + fmtRate(r.rate) + '</strong> ' + sym;
                if (r.source === 'manual') {
                    el.badge.textContent = 'manual' + (r.inverted ? ' (inverted)' : '');
                    el.badge.className = 'badge manual';
                } else {
                    const stale = daysAgo(r.asOf) > STALE_DAYS;
                    el.badge.textContent = fmtDate(r.asOf)
                        + (r.source === 'cached' ? ' · cached' : '')
                        + (stale ? ' · stale' : '');
                    el.badge.className = 'badge' + (stale ? ' stale' : '');
                }
            }

            const own = overrides[pairKey(from, to)];
            el.manualClear.classList.toggle('hidden', !own);
            if (own) {
                el.manualRate.value = String(own.rate);
                el.manualHint.textContent = 'Override active for ' + from + ' → ' + to + ', set ' + ago(own.setAt)
                    + '. Clear it to go back to fetched rates.';
            } else {
                el.manualRate.value = '';
                el.manualRate.placeholder = '1 ' + from + ' = ? ' + to;
                el.manualHint.textContent = (r.rate == null)
                    ? 'No cached rate for this pair. Enter one to convert offline.'
                    : 'Saving a rate here overrides the fetched one for ' + from + ' → ' + to + ' until you clear it.';
            }
            if (r.source === 'none') el.manual.open = true;

            el.net.classList.toggle('hidden', navigator.onLine);
            write(K.ui, ui);
        }

        // ===== Network =====
        async function getJSON(path) {
            const res = await fetch(API + path);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        // no TTL of our own: the API sends cache-control with a max-age that expires at the
        // next publish, so the browser's own HTTP cache is the throttle.
        async function refreshRates({ explicit = false } = {}) {
            el.refresh.disabled = true;
            let failed = false;
            try {
                const body = await getJSON('/rates?base=' + BASE);
                if (!Array.isArray(body) || !body.length) throw new Error('unexpected body');
                rates = body;                      // verbatim
                write(K.rates, rates);
                reindex();
                fresh = true;
                if (!currencies) await refreshCurrencies();
            } catch (err) {
                failed = true;
            } finally {
                el.refresh.disabled = false;
            }

            if (failed && explicit) {               // only an explicit tap surfaces the failure
                el.badge.textContent = navigator.onLine ? 'refresh failed' : 'offline';
                el.badge.className = 'badge stale';
                setTimeout(render, 1800);
                return;
            }
            paintPickers();
            render();
        }

        async function refreshCurrencies() {
            try {
                const body = await getJSON('/currencies');
                if (!Array.isArray(body) || !body.length) return;
                currencies = body;                 // verbatim
                write(K.currencies, currencies);
                names = nameMap();
            } catch {}
        }

        // ===== Events =====
        el.amount.addEventListener('input', () => { ui.amount = el.amount.value; render(); });

        el.from.addEventListener('click', () => openSheet('from'));
        el.to.addEventListener('click', () => openSheet('to'));

        el.sheetQ.addEventListener('input', paintSheet);
        el.sheetQ.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); markActive(active + 1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); markActive(active - 1); }
            else if (e.key === 'Enter') { e.preventDefault(); choose(flat[active] && flat[active].code); }
        });
        el.sheetList.addEventListener('click', (e) => {
            const li = e.target.closest('li[role="option"]');
            if (li) choose(li.dataset.code);
        });
        el.sheetClose.addEventListener('click', () => el.sheet.close());
        // tapping the backdrop closes it (the dialog itself is the click target there)
        el.sheet.addEventListener('click', (e) => { if (e.target === el.sheet) el.sheet.close(); });

        el.swap.addEventListener('click', () => {
            const f = ui.from; ui.from = ui.to; ui.to = f;
            paintPickers();
            render();
        });

        el.refresh.addEventListener('click', () => refreshRates({ explicit: true }));

        el.result.addEventListener('click', () => {
            if (el.result.classList.contains('empty') || !navigator.clipboard) return;
            navigator.clipboard.writeText(el.result.textContent).then(() => {
                const text = el.badge.textContent, cls = el.badge.className;
                el.badge.textContent = 'copied';
                setTimeout(() => { el.badge.textContent = text; el.badge.className = cls; }, 900);
            }).catch(() => {});
        });

        el.manualSave.addEventListener('click', () => {
            const rate = parseAmount(el.manualRate.value);
            if (rate == null || rate <= 0) { el.manualRate.focus(); return; }
            overrides[pairKey(ui.from, ui.to)] = { rate, setAt: Date.now() };
            write(K.overrides, overrides);
            render();
        });

        el.manualClear.addEventListener('click', () => {
            delete overrides[pairKey(ui.from, ui.to)];
            write(K.overrides, overrides);
            render();
        });

        window.addEventListener('online', () => { render(); refreshRates(); });
        window.addEventListener('offline', render);

        // ===== Boot =====
        el.amount.value = ui.amount;
        paintPickers();
        render();
        refreshRates();

        // ===== Service worker + update banner =====
        // On localhost the worker is bypassed: it would serve a cached index.html and hide
        // every edit until CACHE changes. Add ?sw=1 to opt in and test offline behaviour.
        const h = location.hostname;
        const DEV = ['localhost', '127.0.0.1', '[::1]', ''].includes(h)
            || h.endsWith('.localhost') || h.endsWith('.local')     // bonjour / dev TLDs
            || /^127\./.test(h)
            || /^192\.168\./.test(h)                                // LAN: phone testing over wifi
            || /^10\./.test(h)
            || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
        const SW_ENABLED = !DEV || new URLSearchParams(location.search).has('sw');

        if ('serviceWorker' in navigator && !SW_ENABLED) {
            // clean up anything a previous ?sw=1 session left behind, or this page would
            // still be served from that worker's cache
            navigator.serviceWorker.getRegistrations()
                .then((regs) => Promise.all(regs.map((r) => r.unregister())))
                .then((done) => { if (done.length) location.reload(); })
                .catch(() => {});
            if (window.caches) {
                caches.keys().then((keys) => keys.filter((k) => k.startsWith('exchange-'))
                    .forEach((k) => caches.delete(k))).catch(() => {});
            }
            console.info('dev: service worker bypassed — add ?sw=1 to enable it');
        }

        if ('serviceWorker' in navigator && SW_ENABLED) {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
                reg.update().catch(() => {});   // ask on every load, not just on first install
                const offer = (worker) => {
                    if (!worker) return;
                    el.update.classList.remove('hidden');
                    el.reload.onclick = () => worker.postMessage('SKIP_WAITING');
                };
                if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) offer(reg.waiting || sw);
                    });
                });
            }).catch(() => {});

            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloading) return;
                reloading = true;
                location.reload();
            });
        }
    </script>
